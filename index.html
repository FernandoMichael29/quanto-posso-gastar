<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F7B6C" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1514" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Fale o gasto, ele vai para a sua planilha." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icone-192.png" />
    <title>Quanto Posso Gastar</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script>
      // Antes de qualquer pixel: se o app pisca no tema errado e corrige
      // depois, a correção é o que a pessoa vê. Por isso aqui e não no React.
      try {
        var t = localStorage.getItem('qpg.tema');
        if (t && t !== 'auto') document.documentElement.dataset.tema = t;
      } catch (e) { /* modo privado: fica no automático */ }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
